networks:
  itu-minitwit-network:
    external: false
    name: itu-minitwit-network

services:
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8888:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      placement:
        constraints: [node.role == manager]

  app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=${DB_SERVER_IP};Port=5432;Database=mydatabase;Username=myuser;Password=mypassword
    image: ${DOCKER_USERNAME}/itu-minitwit
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - itu-minitwit-network
    depends_on:
      - grafana
      - prometheus
    deploy:
      replicas: 2

  prometheus:
    image: ${DOCKER_USERNAME}/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.wal-compression"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    networks:
      - itu-minitwit-network
    deploy:
      placement:
        constraints: [node.role == manager]

  grafana:
    image: ${DOCKER_USERNAME}/grafana
    ports:
      - "3000:3000"
    networks:
      - itu-minitwit-network
    volumes:
      - grafana-storage:/var/lib/grafana
    deploy:
      placement:
        constraints: [node.role == manager]

  loki:
    image: grafana/loki:3.6.7
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - itu-minitwit-network
    deploy:
      placement:
        constraints: [node.role == manager]

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    networks:
      - itu-minitwit-network
    depends_on:
      - loki
    deploy:
      mode: global

volumes:
  grafana-storage:
    name: minitwit-grafana-storage
