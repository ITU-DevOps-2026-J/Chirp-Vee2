networks:
  itu-minitwit-network:
    external: false
    name: itu-minitwit-network

services:
  app:
    environment:
      - ConnectionStrings__DefaultConnection=Host=dbserver;Port=5432;Database=minitwit;Username=postgres;Password=postgres
    image: ${DOCKER_USERNAME}/itu-minitwit
    ports:
      - "8080:8080"
    networks:
      - itu-minitwit-network
    depends_on:
      - grafana
      - prometheus
    restart: unless-stopped

  prometheus:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/prometheus
    image: ${DOCKER_USERNAME}/prometheus
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - itu-minitwit-network

  grafana:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/grafana
    image: ${DOCKER_USERNAME}/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - itu-minitwit-network
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: {}
  db-data:
    name: minitwit-data
