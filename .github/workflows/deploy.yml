name: Continuous Deployment

on:
  push:
    # Run workflow every time something is pushed to the main branch
    branches:
      - main
  # allow manual triggers for now too
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Remember to set the following secrets in your repository's settings:
# https://github.com/your_username/itu-minitwit-ci/settings/secrets/actions
# DOCKER_USERNAME
# DOCKER_ACCESS_TOKEN
# SSH_USER
# SSH_KEY
# SSH_HOST

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test minitwit
        run: |
          docker build -t $DOCKER_USERNAME/minitwittestimage -f Chirp-Project/test/Dockerfile .
          docker compose -f Chirp-Project/test/docker-compose.yml up
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Build and push itu-minitwit
        uses: docker/build-push-action@v6
        with:
          context: Chirp-Project
          file: Chirp-Project/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/itu-minitwit:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/itu-minitwit:webbuildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/itu-minitwit:webbuildcache,mode=max

      - name: Docker Scout CVE analysis
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/itu-minitwit:latest
          summary: true
          sarif-file: scout-itu-minitwit.sarif

      - name: Upload Docker Scout SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-itu-minitwit.sarif

      - name: Build and push prometheus
        uses: docker/build-push-action@v6
        with:
          context: Chirp-Project
          file: Chirp-Project/monitoring/prometheus/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/prometheus:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/prometheus:webbuildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/prometheus:webbuildcache,mode=max

      - name: Build and push grafana
        uses: docker/build-push-action@v6
        with:
          context: Chirp-Project
          file: Chirp-Project/monitoring/grafana/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/grafana:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/grafana:webbuildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/grafana:webbuildcache,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/do_ssh_key
          chmod 600 ~/.ssh/do_ssh_key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        # Configure the ~./bash_profile and deploy.sh file on the Vagrantfile
        run: |
          ssh $SSH_USER@$SSH_HOST -i ~/.ssh/do_ssh_key -o StrictHostKeyChecking=no '../vagrant/deploy.sh'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
